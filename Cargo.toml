[package]
name = "ip-calculator"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "IPv4/IPv6 subnet calculator in the style of the Bitcricket IP Calculator"
authors = ["© StofflHD and Claude"]

[dependencies]
# Pinned: the egui API changes between releases.
eframe = { version = "=0.29.1", features = ["persistence"] }
egui_extras = "=0.29.1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
